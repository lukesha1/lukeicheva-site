<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наталья Лукеичева | LUKEICHEVA</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #fcfcfc; color: #111; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        h1, h2, h3, .logo { font-family: 'Cormorant Garamond', serif; }

        /* ----- ШАПКА И МЕНЮ ----- */
        header {
            position: absolute;
            top: 0; width: 100%;
            padding: 30px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Переключатель языков (правый верхний угол) */
        .lang-switch {
            position: absolute;
            top: 30px; right: 50px;
            font-size: 12px;
            letter-spacing: 2px;
        }
        .lang-switch a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            transition: 0.3s;
        }
        .lang-switch a.active, .lang-switch a:hover { color: #fff; font-weight: 600; }

        .logo {
            font-size: 42px;
            color: #fff;
            letter-spacing: 14px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        /* Навигация (Ссылки) */
        .main-menu {
            display: flex;
            gap: 30px; /* Расстояние между ссылками */
        }
        .main-menu a {
            color: #fff;
            text-decoration: none;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 500;
            padding-bottom: 5px;
            border-bottom: 1px solid transparent;
            transition: 0.3s;
        }
        .main-menu a:hover {
            border-bottom: 1px solid #fff; /* Подчеркивание при наведении */
        }

        /* ----- ПЕРВЫЙ ЭКРАН (ВИДЕО) ----- */
        .hero {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex;
            align-items: center; justify-content: center;
            overflow: hidden;
        }

        .hero video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Градиентное затемнение (чтобы меню и нижний текст всегда читались поверх любого видео) */
        .video-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.2) 20%, rgba(0,0,0,0.2) 80%, rgba(0,0,0,0.7) 100%);
            z-index: 2;
        }

        /* ----- НИЖНЯЯ НАДПИСЬ НА ВИДЕО ----- */
        .hero-bottom-text {
            position: absolute;
            bottom: 40px; /* Отступ снизу */
            z-index: 3;
            color: #fff;
            font-size: 16px;
            font-weight: 600; /* Сделали пожирнее */
            letter-spacing: 8px;
            text-transform: uppercase;
            text-align: center;
        }

        /* Временные блоки-заглушки для разделов, чтобы меню работало при клике */
        section.content-block {
            padding: 100px 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        section.content-block h2 { font-size: 36px; margin-bottom: 20px; }

        @media (max-width: 768px) {
            .logo { font-size: 28px; letter-spacing: 8px; margin-bottom: 15px; }
            .main-menu { flex-wrap: wrap; justify-content: center; gap: 15px; }
            .lang-switch { position: static; margin-bottom: 15px; }
            .hero-bottom-text { font-size: 13px; letter-spacing: 5px; }
        }
    </style>
</head>
<body>

    <!-- Шапка, Меню и Языки -->
    <header>
        <div class="lang-switch">
            <span style="color:#fff">RU</span> / <a href="en.html">EN</a>
        </div>
        <div class="logo">LUKEICHEVA</div>
        <nav class="main-menu">
            <a href="#about">Биография</a>
            <a href="#gallery">Портфолио</a>
            <a href="#acting">Актерские работы</a>
            <a href="#directing">Режиссура</a>
            <a href="#writing">Сценарии и тексты</a>
        </nav>
    </header>

    <!-- Видео -->
    <section class="hero">
        <!-- СЛОВО loop отвечает за бесконечный повтор! -->
        <video autoplay loop muted playsinline id="bg-video">
            <source src="showreel.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
        
        <!-- Надпись снизу -->
        <div class="hero-bottom-text">ACTRESS & DIRECTOR</div>
    </section>

    <!-- Разделы (пока пустые, для структуры) -->
    <section id="about" class="content-block">
        <h2>Наталья Лукеичева</h2>
        <p>Здесь будет биография актрисы и режиссера...</p>
    </section>

    <section id="gallery" class="content-block">
        <h2>Портфолио</h2>
        <p>Здесь будут фотографии...</p>
    </section>

    <!-- и так далее -->

</body>
</html>
